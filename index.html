<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yaretzy Murillo — Digital Product Design</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="hero-workspace">

    <!-- Ambient background lighting -->
    <div class="ambient-lights">
      <div class="ambient-spot spot-violet"></div>
      <div class="ambient-spot spot-magenta"></div>
      <div class="ambient-spot spot-blue"></div>
    </div>

    <!-- LAPTOP WRAPPER — single positioning context for image + overlays -->
    <div class="laptop-3d-wrapper">

      <!-- Replace "computer3d.png" with your high-fidelity laptop mockup image -->
      <img src="computer3d1.png" class="laptop-mockup-img" alt="Workspace Laptop" />

      <!-- Screen text overlay (positioned over laptop screen area) -->
      <div class="screen-text-overlay">
        <div class="glitch-text" id="glitch-text">
          <div class="glitch-line" data-text="I design">I design,</div>
          <div class="glitch-line" data-text="build and">build and</div>
          <div class="glitch-line" data-text="launch digital">launch digital</div>
          <div class="glitch-line" data-text="products.">products.</div>
        </div>
        <!-- Screen frame overlay -->
        <div class="screen-frame-wrapper">
          <div class="marco-container">
            <img src="marco.png" class="screen-frame-img" alt="Technical Screen Frame">
            <!-- Globe positioned inside the marco -->
            <div class="internet-logo-wrapper">
              <img src="internet.png" class="internet-icon-img" alt="Network Grid Globe">
            </div>
          </div>
        </div>
      </div>

      <!-- POST-IT WINDOWS (custom yellow sticky note PNGs) -->
      <div class="postit-window postit-tl">
        <img src="launch_date.png" class="postit-img" alt="Launch Date" />
      </div>

      <div class="postit-window postit-bl">
        <img src="ux_flow.png" class="postit-img" alt="UX Flow" />
      </div>

      <div class="postit-window postit-tr">
        <img src="client_review.png" class="postit-img" alt="Client Review" />
      </div>

      <div class="postit-window postit-br">
        <img src="future_ready.png" class="postit-img" alt="Future Ready" />
      </div>

      <!-- Projects badge -->
      <div class="floating-badge" id="floating-badge">
        <svg viewBox="0 0 140 140" class="badge-svg">
          <defs>
            <path id="badge-arc" d="M 70,70 m -58,0 a 58,58 0 1,1 116,0 a 58,58 0 1,1 -116,0" />
          </defs>
          <circle cx="70" cy="70" r="58" fill="none" stroke="rgba(42,49,66,0.3)" stroke-width="0.5" />
          <circle cx="70" cy="70" r="52" fill="none" stroke="rgba(42,49,66,0.15)" stroke-width="0.3" />
          <text font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(253,234,194,0.3)" letter-spacing="6">
            <textPath href="#badge-arc" startOffset="0%">PROJECTS . PROJECTS . PROJECTS .</textPath>
          </text>
          <circle cx="70" cy="70" r="3" fill="rgba(16,232,246,0.2)" />
        </svg>
      </div>

    </div>

  </div>

  <!-- GSAP only (no Three.js needed) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
